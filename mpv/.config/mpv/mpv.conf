vo=gpu-next

# force starting with centered window
geometry=50%:50%

# don't allow a new window to have a size larger than 90% of the screen size
autofit-larger=90%x90%

# Specify high quality video rendering preset (for --vo=<gpu|gpu-next> only)
# Offers superior image fidelity and visual quality for an enhanced viewing
# experience on capable hardware
profile=high-quality

# Нашел у кого-то в конфиге, вроде лучше контрастность и темные сцены
tone-mapping=bt.2446a

save-position-on-quit=yes

# Ниже скопированные поля, я их не проверял
#Субтитры
slang=rus,ru
sub-ass-vsfilter-color-compat=full
sub-auto=fuzzy
sub-file-paths=**
sub-font="calibri bold"
sub-margin-y=50
sub-font-size=50
sub-color="#FFFFFFFF"
sub-border-size=2
sub-blur=1